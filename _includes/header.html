<header class="site-header">
  <div class="container header-inner">
    <a class="site-logo" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="site-nav" aria-label="Main navigation">
      <ul>
        {% for item in site.data.navigation %}
          {% assign item_url = item.url | relative_url %}
          {% assign current_path = page.url | relative_url %}
          <li>
            <a href="{{ item_url }}"
               {% if current_path == item_url %}class="active" aria-current="page"{% endif %}>
              {{ item.title }}
            </a>
          </li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
