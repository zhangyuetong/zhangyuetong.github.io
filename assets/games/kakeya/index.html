<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Kakeya</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <canvas id="board" aria-label="Kakeya game board"></canvas>

    <div class="hud">
      <div class="hud-row">
        <span class="label">扫过面积</span>
        <span id="area" class="value">0</span>
      </div>
      <div class="hud-row">
        <span class="label">方向进度</span>
        <span id="progress" class="value">0%</span>
      </div>
      <div class="hud-row best-row">
        <span class="label">最佳记录</span>
        <span id="best" class="value">—</span>
      </div>
    </div>

    <div id="overlay" class="overlay">
      <div class="panel">
        <h1>Kakeya</h1>
        <p class="subtitle">挂谷集 · needle problem</p>
        <p class="instructions">
          用<strong>两根手指</strong>按住屏幕操作一根棍子，<br>
          让棍子的方向<strong>转满一圈</strong>，<br>
          同时尽量减小棍子扫过的总面积。
        </p>
        <p class="tip">双指位置决定棍子的位置与朝向</p>
        <button id="start-btn" type="button">开始</button>
      </div>
    </div>

    <div id="complete" class="overlay hidden">
      <div class="panel">
        <h1>完成！</h1>
        <p class="result">扫过面积：<strong id="final-area">0</strong></p>
        <p id="record-msg" class="record-msg hidden">新纪录！</p>
        <button id="retry-btn" type="button">再试一次</button>
      </div>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
